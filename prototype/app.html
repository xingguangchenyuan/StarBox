<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>星匣 StarBox — 交互原型</title>
<link rel="stylesheet" href="proto.css">
<style>
  /* ════════ 原型用：封面占位图形（正式版为真实封面图）════════ */
  .g1 { background: repeating-radial-gradient(circle at 32% 26%, rgba(255,255,255,.45) 0 1px, transparent 1px 13px); }
  .g2 { background: repeating-linear-gradient(116deg, rgba(255,255,255,.40) 0 1.5px, transparent 1.5px 10px); }
  .g3 { background:
        radial-gradient(circle at 70% 66%, rgba(255,255,255,.55) 0 24px, transparent 25px),
        radial-gradient(circle at 70% 66%, transparent 0 38px, rgba(255,255,255,.22) 39px, transparent 40px); }
  .g4 { background: conic-gradient(from 196deg at 50% 112%, rgba(255,255,255,.36) 0 20deg, transparent 20deg 36deg); }
  .g5 { background: radial-gradient(rgba(255,255,255,.45) 1px, transparent 1.4px); background-size: 11px 11px; }
  .g6 { background: repeating-linear-gradient(90deg, rgba(255,255,255,.36) 0 3px, transparent 3px 9px);
        -webkit-mask-image: linear-gradient(0deg, transparent 4%, #000 92%); }
  .g7 { background: linear-gradient(52deg, transparent 44%, rgba(255,255,255,.35) 44% 45%, transparent 45%),
                   linear-gradient(52deg, transparent 62%, rgba(255,255,255,.20) 62% 62.6%, transparent 62.6%); }
  .g8 { background: repeating-conic-gradient(from 0deg at 20% 80%, rgba(255,255,255,.3) 0 6deg, transparent 6deg 16deg); }

  /* ════════ 侧栏：8 个筛选项 + 全量游戏列表 ════════ */
  .filters .f-item { cursor: pointer; user-select: none; }
  .filters .f-item:hover { background: rgba(255,255,255,.035); color: var(--text); }
  .filters .f-item.is-on:hover { background: rgba(102,192,244,.16); }
  .f-item .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f-item .n.is-zero { opacity: .45; }

  .lib-head { align-items: center; }
  /* 列表底部的渐隐会让最后一行读不清，这里取消 */
  .games { -webkit-mask-image: none; }
  .lib-clear {
    margin-left: auto; display: none; align-items: center; gap: 4px; cursor: pointer;
    font-size: 10px; color: var(--text-2); border: 1px solid var(--line);
    height: 17px; padding: 0 6px; border-radius: 4px;
  }
  .lib-clear:hover { color: var(--text); border-color: var(--text-3); }
  .lib-head.is-search .lib-clear { display: inline-flex; }
  .lib-head.is-search .c { display: none; }

  /* 游戏行：Steam 库那种“点哪个进哪个” */
  .g { cursor: pointer; user-select: none; }
  .g:hover { background: rgba(255,255,255,.032); }
  .g:hover .gn { color: var(--text); }
  .g:focus-visible { outline: 2px solid var(--hi); outline-offset: -2px; }
  .g .gt { position: relative; overflow: hidden; }
  .g .gt::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(150deg, rgba(255,255,255,.16), transparent 56%);
  }
  .g .run { width: 5px; height: 5px; flex: 0 0 5px; border-radius: 50%;
            background: var(--ok); box-shadow: 0 0 0 3px rgba(127,212,162,.16); }
  .g .fav { width: 9px; height: 9px; flex: 0 0 9px; color: #d9b25e; opacity: .85; }
  .lib-empty { padding: 20px 10px; font-size: 11.5px; line-height: 1.75; color: var(--text-3); }
  .lib-empty b { display: block; color: var(--text-2); font-weight: 600; margin-bottom: 3px; }

  /* ════════ 视图切换 ════════ */
  .view { display: none; flex-direction: column; flex: 1 1 auto; min-height: 0; position: relative; z-index: 1; }
  .view.is-on { display: flex; }
  #v-library { animation: viewIn .22s cubic-bezier(.2,.8,.2,1) both; }
  #v-detail  { animation: viewIn .22s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

  /* 封面墙在剩余高度里滚动 */
  .wall {
    flex: 1 1 auto; min-height: 0; align-content: start;
    overflow-y: auto; overflow-x: hidden; padding-bottom: 2px;
  }
  .btn-still[hidden] { display: none; }

  .card { cursor: pointer; }
  .card:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; border-radius: 9px; }
  .card .cover { transition: transform .18s ease, box-shadow .18s ease; }
  .card:hover .cover { transform: translateY(-3px); box-shadow: 0 12px 26px rgba(0,0,0,.52); }
  .card:hover .t-en { color: #fff; }

  /* 库头部统计 */
  .stats { display: flex; align-items: center; gap: 16px; margin-top: 15px; }
  .stat { display: flex; align-items: baseline; gap: 6px; }
  .stat b { font-family: var(--font-mono); font-size: 14px; font-weight: 400; color: var(--text); letter-spacing: -.02em; }
  .stat span { font-size: 10.5px; color: var(--text-3); letter-spacing: .04em; }
  .stat-div { width: 1px; height: 12px; background: var(--line-soft); }

  /* 搜索框：去掉 input 的默认边框 */
  .search input {
    flex: 1 1 auto; min-width: 0; height: 100%;
    background: none; border: 0; outline: 0; padding: 0;
    font-family: inherit; font-size: 12.5px; color: var(--text);
  }
  .search input::placeholder { color: var(--text-3); }
  .search:focus-within { border-color: rgba(102,192,244,.4); }
  .search:focus-within svg { opacity: .85; }

  /* 排序与启动按钮的可点提示 */
  .sortbtn { cursor: pointer; }
  .sortbtn:hover { color: var(--hi); }
  .btn-play { cursor: pointer; border: 0; font-family: inherit; }
  .btn-ghost { cursor: pointer; font-family: inherit; }

  /* ════════ 详情：头图 ════════ */
  .hero3 {
    position: relative; z-index: 1; flex: 0 0 300px; height: 300px;
    display: flex; align-items: flex-end; padding: 0 32px 22px;
  }
  .hero3-art { position: absolute; inset: 0; overflow: hidden; }
  .hero3-art .fill {
    position: absolute; inset: 0;
    background:
      radial-gradient(760px 420px at 62% 26%, rgba(126,196,246,.55), transparent 68%),
      radial-gradient(480px 300px at 90% 96%, rgba(58,141,196,.34), transparent 72%),
      linear-gradient(112deg, #0f2438 0%, #163a58 48%, #0b1622 100%);
  }
  /* 每个游戏自己的一点色相，压得很低，只在左下角透出来 */
  .hero3-art .tint {
    position: absolute; inset: 0; opacity: .45; mix-blend-mode: screen;
    background: radial-gradient(660px 420px at 14% 96%, var(--a), transparent 66%);
  }
  .hero3-art .veil {
    position: absolute; inset: 0; opacity: .85;
    background: repeating-linear-gradient(114deg, rgba(180,226,255,.07) 0 2px, transparent 2px 26px);
    -webkit-mask-image: radial-gradient(720px 420px at 66% -6%, #000 0%, transparent 74%);
  }
  .hero3-art .scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, var(--stage) 0%, rgba(14,20,27,.82) 26%, rgba(14,20,27,.12) 64%, rgba(14,20,27,.46) 100%),
      linear-gradient(0deg, var(--stage) 0%, rgba(14,20,27,.28) 28%, transparent 62%);
  }

  .hero3-top {
    position: absolute; left: 32px; right: 26px; top: 15px; z-index: 3;
    display: flex; align-items: center; gap: 12px;
  }
  .back {
    display: flex; align-items: center; gap: 7px; cursor: pointer;
    height: 29px; padding: 0 12px 0 9px; border-radius: 7px;
    background: rgba(10,16,23,.5); border: 1px solid var(--line-soft);
    font-size: 11.5px; color: var(--text-2);
  }
  .back:hover { color: var(--text); border-color: var(--line); }
  .crumb { font-size: 11.5px; color: var(--text-3); }
  .crumb b { font-weight: 400; color: var(--text-2); }
  .hero3-top .spacer { flex: 1 1 auto; }
  .icon-btn {
    width: 29px; height: 29px; border-radius: 7px; cursor: pointer;
    background: rgba(10,16,23,.5); border: 1px solid var(--line-soft);
    display: grid; place-items: center; color: var(--text-2);
  }
  .icon-btn:hover { color: var(--text); border-color: var(--line); }

  .hero3-body { position: relative; z-index: 3; max-width: 660px; }
  .hero3-title {
    font-family: var(--font-display); font-size: 38px; font-weight: 800;
    letter-spacing: -.028em; line-height: 1.04; margin-bottom: 9px;
  }
  .hero3-title small {
    font-size: 15px; font-weight: 400; letter-spacing: .02em;
    color: var(--text-2); margin-left: 13px;
  }
  .hero3-meta {
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
    font-size: 11.5px; color: var(--text-2); margin-bottom: 15px;
  }
  .hero3-meta .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); }
  .tagpill {
    height: 20px; padding: 0 8px; border-radius: 4px;
    background: rgba(102,192,244,.10); border: 1px solid rgba(102,192,244,.20);
    color: #9dd3f5; font-size: 10.5px; display: inline-flex; align-items: center;
  }
  .hero3-actions { display: flex; align-items: center; gap: 9px; }
  .btn-play.big { height: 42px; padding: 0 24px 0 21px; font-size: 14px; }
  .btn-play .chev {
    margin-left: 4px; padding-left: 10px; border-left: 1px solid rgba(8,19,28,.24);
    display: flex; align-items: center;
  }
  .btn-still {
    width: 42px; height: 42px; border-radius: 8px; display: grid; place-items: center;
    background: rgba(27,40,56,.62); border: 1px solid var(--line); color: var(--text-2);
  }
  .btn-still:hover { color: var(--warn); border-color: rgba(224,100,90,.45); }
  .btn-ghost.is-on { border-color: rgba(217,178,94,.42); color: #e6c882; }

  /* ════════ 详情：页签与内容 ════════ */
  .under {
    position: relative; z-index: 1; flex: 1 1 auto; min-height: 0;
    padding: 0 32px 24px; display: flex; flex-direction: column;
  }
  .tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--line-soft); flex: 0 0 auto; }
  .tab {
    position: relative; height: 40px; display: flex; align-items: center; gap: 7px;
    font-size: 12.5px; color: var(--text-2); cursor: pointer; background: none; border: 0;
    font-family: inherit; padding: 0;
  }
  .tab:hover { color: var(--text); }
  .tab .n {
    font-family: var(--font-mono); font-size: 10px; color: var(--text-3);
    border: 1px solid var(--line-soft); border-radius: 3px; padding: 0 4px; line-height: 13px;
  }
  .tab.is-on { color: var(--text); font-weight: 600; }
  .tab.is-on::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
    height: 2px; background: var(--hi); border-radius: 2px;
  }
  .pane-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-right: 2px; }
  .pane { display: none; }
  .pane.is-on { display: block; }
  .pane.is-on { animation: paneIn .18s ease both; }
  @keyframes paneIn { from { opacity: 0; } to { opacity: 1; } }

  .body { display: grid; grid-template-columns: 1fr 292px; gap: 34px; padding: 20px 0 8px; }
  .sec { margin-bottom: 22px; }
  .sec-title {
    font-size: 13px; font-weight: 700; letter-spacing: .02em;
    margin-bottom: 9px; display: flex; align-items: baseline; gap: 8px;
  }
  .sec-title .mono2 { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); font-weight: 400; }
  .desc { font-size: 12.8px; line-height: 1.95; color: #b6c6d6; max-width: 690px; }
  .desc + .desc { margin-top: 10px; }

  .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .shot {
    position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden;
    background: linear-gradient(150deg, var(--a), var(--b));
    border: 1px solid var(--line-soft);
  }
  .shot::after {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(90% 70% at 30% 20%, rgba(150,205,245,.26), transparent 72%),
      linear-gradient(0deg, rgba(4,8,12,.5), transparent 60%);
  }
  .shot .lbl {
    position: absolute; left: 8px; bottom: 7px; z-index: 2;
    font-family: var(--font-mono); font-size: 9.5px; color: rgba(255,255,255,.55);
  }

  .side { padding-top: 1px; }
  .panel {
    border: 1px solid var(--line-soft); border-radius: 10px;
    background: rgba(22,32,45,.55); padding: 4px 14px 8px;
  }
  .row {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 11.5px;
  }
  .row:last-child { border-bottom: 0; }
  .row .k { color: var(--text-3); flex: 0 0 auto; }
  .row .v {
    color: var(--text-2); text-align: right; font-family: var(--font-mono);
    font-size: 11px; white-space: nowrap; line-height: 1.5;
  }
  .row .v.hi { color: var(--hi); }
  .row.col { flex-direction: column; align-items: stretch; gap: 5px; }
  .row.col .v { text-align: left; color: var(--text-2); }

  .achbar {
    margin-top: 14px; border: 1px solid var(--line-soft); border-radius: 10px;
    background: rgba(22,32,45,.55); padding: 13px 14px;
    display: flex; align-items: center; gap: 12px; cursor: pointer;
  }
  .achbar:hover { border-color: var(--line); }
  .ring {
    position: relative; width: 44px; height: 44px; border-radius: 50%;
    background: conic-gradient(var(--hi) calc(var(--p) * 1%), rgba(255,255,255,.08) 0);
    flex: 0 0 44px; display: grid; place-items: center;
  }
  .ring i {
    width: 36px; height: 36px; border-radius: 50%; background: #131d29;
    display: grid; place-items: center; font-style: normal;
    font-family: var(--font-mono); font-size: 10px; color: var(--text);
  }
  .achbar .t1 { font-size: 12px; font-weight: 600; }
  .achbar .t2 { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); margin-top: 3px; }
  .achbar .go { margin-left: auto; color: var(--text-3); }

  .recent { display: flex; gap: 8px; }
  .rc {
    flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 9px;
    background: rgba(22,32,45,.62); border: 1px solid var(--line-soft);
  }
  .rc .ico {
    width: 30px; height: 30px; flex: 0 0 30px; border-radius: 6px;
    background: linear-gradient(150deg, var(--a), var(--b));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
    display: grid; place-items: center;
  }
  .rc .ico svg { width: 14px; height: 14px; color: rgba(255,255,255,.9); }
  .rc .tx { min-width: 0; }
  .rc .n {
    font-size: 11.5px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rc .d { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-3); margin-top: 2px; }

  /* ════════ 成就 ════════ */
  .ach-head { display: flex; align-items: center; gap: 14px; padding: 18px 0 14px; }
  .ring-lg {
    position: relative; width: 54px; height: 54px; border-radius: 50%; flex: 0 0 54px;
    background: conic-gradient(var(--hi) calc(var(--p) * 1%), rgba(255,255,255,.07) 0);
    display: grid; place-items: center;
  }
  .ring-lg i {
    width: 45px; height: 45px; border-radius: 50%; background: var(--stage);
    display: grid; place-items: center; font-style: normal;
    font-family: var(--font-mono); font-size: 12px; color: var(--text);
  }
  .ach-head .big { font-family: var(--font-mono); font-size: 17px; color: var(--text); }
  .ach-head .big span { font-size: 12px; color: var(--text-3); }
  .ach-head .sm { font-size: 10.5px; color: var(--text-3); margin-top: 3px; }
  .src {
    margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
    height: 24px; padding: 0 10px; border-radius: 999px;
    background: rgba(102,192,244,.09); border: 1px solid rgba(102,192,244,.2);
    color: #9dd3f5; font-size: 10.5px;
  }
  .src i { width: 4px; height: 4px; border-radius: 50%; background: var(--ok); }

  .chips-bar { padding: 0 0 14px; border-bottom: 1px solid var(--line-soft); margin-bottom: 14px; }
  .ach-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; padding-bottom: 4px; }
  .ach {
    display: flex; align-items: center; gap: 12px; height: 74px; padding: 0 14px 0 12px;
    border-radius: 9px; background: rgba(22,32,45,.62); border: 1px solid transparent;
  }
  .ach.is-locked { background: rgba(19,27,38,.55); }
  .ach-ico {
    position: relative; width: 46px; height: 46px; flex: 0 0 46px; border-radius: 7px;
    background: linear-gradient(150deg, var(--a), var(--b));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
  }
  .ach-ico svg { position: absolute; inset: 0; margin: auto; width: 20px; height: 20px; color: rgba(255,255,255,.88); }
  .is-locked .ach-ico { filter: grayscale(1) brightness(.62); }
  .ach-body { min-width: 0; flex: 1 1 auto; }
  .ach-name {
    font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .is-locked .ach-name { color: var(--text-2); font-weight: 500; }
  .ach-desc {
    font-size: 10.8px; color: var(--text-3); margin-top: 4px; line-height: 1.35;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ach-right { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .rar { font-family: var(--font-mono); font-size: 11px; color: var(--text-2); text-align: right; }
  .rar .bar { width: 38px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.11); margin-top: 5px; }
  .rar .bar i { display: block; height: 100%; background: var(--hi); }
  .is-locked .rar { color: var(--text-3); }
  .is-locked .rar .bar i { background: #3a4d63; }
  .when { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-3); }

  .empty-panel {
    max-width: 620px; margin-top: 4px; padding: 20px 22px;
    border: 1px dashed var(--line); border-radius: 10px; background: rgba(22,32,45,.35);
  }
  .empty-panel h4 { font-size: 12.5px; font-weight: 600; margin-bottom: 7px; color: var(--text-2); }
  .empty-panel p { font-size: 11.5px; line-height: 1.9; color: var(--text-3); }
  .empty-panel .actions { display: flex; gap: 8px; margin-top: 14px; }

  /* ════════ MOD ════════ */
  .mod-head { display: flex; align-items: center; gap: 10px; padding: 18px 0 12px; max-width: 780px; }
  .mod-head .path {
    font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3);
    background: rgba(22,32,45,.6); border: 1px solid var(--line-soft);
    border-radius: 6px; padding: 5px 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mod-head .spacer { flex: 1 1 auto; }
  .mods { display: flex; flex-direction: column; gap: 2px; max-width: 780px; }
  .mod {
    display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 12px;
    border-radius: 8px; border: 1px solid transparent; cursor: pointer;
  }
  .mod:hover { background: rgba(255,255,255,.028); }
  .mod .mn { font-size: 12.5px; color: var(--text); }
  .mod.is-off .mn { color: var(--text-2); }
  .mod .mv { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-3); margin-top: 2px; }
  .mod .order {
    margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--text-3);
    border: 1px solid var(--line-soft); border-radius: 4px; padding: 1px 6px;
  }
  .mod .sz { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); width: 58px; text-align: right; }

  .switch {
    width: 30px; height: 17px; flex: 0 0 30px; border-radius: 999px; position: relative;
    background: rgba(255,255,255,.13); cursor: pointer; border: 0; padding: 0;
    transition: background .16s;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px;
    border-radius: 50%; background: #8ba1b8; transition: left .16s, background .16s;
  }
  .switch.is-on { background: rgba(102,192,244,.34); }
  .switch.is-on::after { left: 15px; background: var(--hi); }

  /* ════════ 启动选项 ════════ */
  .opts { display: grid; grid-template-columns: 1fr 292px; gap: 34px; padding: 20px 0 8px; }
  .opt-row {
    display: flex; align-items: center; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid var(--line-soft);
  }
  .opt-row:last-child { border-bottom: 0; }
  .opt-row .ok { font-size: 12px; color: var(--text-2); width: 92px; flex: 0 0 92px; }
  .opt-row .opt-hint { margin-left: auto; }
  .field {
    flex: 1 1 auto; min-width: 0; height: 32px; border-radius: 7px;
    background: rgba(27,40,56,.6); border: 1px solid var(--line-soft);
    display: flex; align-items: center; padding: 0 10px;
    font-family: var(--font-mono); font-size: 11px; color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .field.dim { color: var(--text-3); }
  .profiles { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .prof {
    display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 11px;

/* ═══════════ 状态 ═══════════ */
const state = {
  game: null,
  tab: 'overview',
  view: 'all',      // all | recent | running | fav | tag:<id>
  plat: 'all',
  q: '',
  sort: 'recent',
  achFilter: 'all'
};

const $  = s => document.querySelector(s);
const byId = id => GAMES.find(g => g.id === id);
const fmtH = h => h > 0 ? h.toFixed(1) + ' 小时' : '尚未游玩';
const achPct = g => g.ach.total ? Math.round(g.ach.unlocked / g.ach.total * 100) : 0;
const PLATNAME = p => p === 'steam' ? 'Steam 库' : p === 'epic' ? 'Epic 库' : '本地添加';

const VIEWS = {
  all:     () => GAMES.length,
  recent:  () => GAMES.filter(g => g.rec < 30).length,
  running: () => GAMES.filter(g => g.running).length,
  fav:     () => GAMES.filter(g => g.fav).length
};
const viewCount = v => v.startsWith('tag:')
  ? GAMES.filter(g => g.tags.includes(v.slice(4))).length
  : VIEWS[v]();

function viewTitle(v) {
  if (v === 'all') return '所有游戏';
  if (v === 'recent') return '最近游玩';
  if (v === 'running') return '正在运行';
  if (v === 'fav') return '收藏';
  const t = TAGS.find(x => x.id === v.slice(4));
  return t ? t.name : '所有游戏';
}

function inView(g) {
  if (state.view === 'recent')  return g.rec < 30;
  if (state.view === 'running') return !!g.running;
  if (state.view === 'fav')     return !!g.fav;
  if (state.view.startsWith('tag:')) return g.tags.includes(state.view.slice(4));
  return true;
}

function matches(g, q) {
  if (!q) return true;
  const s = (g.cn + g.en + g.studio).toLowerCase();
  return s.includes(q.toLowerCase());
}

function sortGames(list) {
  const l = list.slice();
  if (state.sort === 'hours')      l.sort((a, b) => b.hours - a.hours);
  else if (state.sort === 'name')  l.sort((a, b) => a.cn.localeCompare(b.cn, 'zh-Hans-CN'));
  else                             l.sort((a, b) => a.rec - b.rec || b.hours - a.hours);
  return l;
}

/* 侧栏列表始终是「所有游戏」，只被搜索影响 */
function railList() {
  return sortGames(GAMES.filter(g => matches(g, state.q)));
}

/* 封面墙 = 当前筛选 + 平台 + 搜索 */
function wallList() {
  return sortGames(GAMES.filter(g =>
    inView(g) && matches(g, state.q) && (state.plat === 'all' || g.plat === state.plat)));
}

/* ═══════════ 侧栏 ═══════════ */
function renderNav() {
  const rows = [
    { v:'all',     icon:'grid',  label:'全部游戏' },
    { v:'recent',  icon:'clock', label:'最近游玩' },
    { v:'running', icon:'play',  label:'正在运行', hot:true },
    { v:'fav',     icon:'star',  label:'收藏' },
    ...TAGS.map(t => ({ v:'tag:' + t.id, sw:t.color, label:t.name }))
  ];
  $('#nav').innerHTML = rows.map((r, i) => {
    const n = viewCount(r.v);
    const on = state.view === r.v && !state.game;
    const mark = r.sw
      ? `<span class="sw" style="background:${r.sw}"></span>`
      : `<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">${ICONS[r.icon]}</svg>`;
    /* 分类紧接在筛选后面：同一组，不另起标题 */
    const gap = i === 4 ? ' style="margin-top:6px"' : '';
    return `<div class="f-item${on ? ' is-on' : ''}${r.hot ? ' is-hot' : ''}"${gap} data-view="${r.v}"
              role="button" tabindex="0">
      ${mark}<span class="lbl">${r.label}</span>
      <span class="n${n === 0 ? ' is-zero' : ''}">${n}</span>
    </div>`;
  }).join('');
}

function renderRail() {
  const list = railList();
  $('#libTitle').textContent = state.q ? '搜索结果' : '所有游戏';
  $('#libCount').textContent = list.length;
  $('#libHead').classList.toggle('is-search', !!state.q);

  if (!list.length) {
    $('#games').innerHTML = `<div class="lib-empty"><b>没有找到游戏</b>换个关键词试试，比如「霜落」或「Kestrel」。</div>`;
    return;
  }

  $('#games').innerHTML = list.map(g => {
    const on = state.game === g.id;
    const right = g.running
      ? `<span class="run" title="运行中"></span>`
      : (g.fav ? `<svg class="fav" viewBox="0 0 16 16" fill="currentColor" aria-label="已收藏"><path d="M8 2.4l1.72 3.6 3.88.5-2.86 2.72.74 3.86L8 11.2l-3.48 1.88.74-3.86L2.4 6.5l3.88-.5z"/></svg>` : '');
    return `<div class="g${on ? ' is-on' : ''}" data-game="${g.id}" role="option"
              aria-selected="${on}" tabindex="0" title="${g.cn} · ${g.studio}">
      <span class="gt" style="--a:${g.a};--b:${g.b}"></span>
      <span class="gx"><span class="gn">${g.cn}</span><span class="gs">${fmtH(g.hours)}</span></span>
      ${right}
    </div>`;
  }).join('');

  const active = $('#games').querySelector('.is-on');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

  const list = wallList();

}

  $('#hero3').style.setProperty('--a', g.a);
  $('#hero3').style.setProperty('--b', g.b);

  $('#dTitle').innerHTML = `${g.cn}<small>${g.en}</small>`;
  $('#crumbName').textContent = g.cn;

  $('#dMeta').innerHTML = `
    <span>${g.studio}</span><span class="sep"></span>
    <span>${g.year}</span><span class="sep"></span>
    ${g.tags.map(t => `<span class="tagpill">${TAGS.find(x => x.id === t).name}</span>`).join('')}
    <span class="sep"></span>
    <span class="mono">${g.plat === 'steam' ? '好评率 94%' : g.plat === 'epic' ? 'Epic 评分 4.6' : '本地添加'}</span>`;

  $('#playLabel').textContent = g.running ? '切回游戏' : '开始游戏';
  $('#btnStill').hidden = !g.running;
  $('#achLabel').textContent = `成就 ${g.ach.unlocked} / ${g.ach.total}`;
  $('#favLabel').textContent = g.fav ? '已收藏' : '收藏';
  $('#btnFav').classList.toggle('is-on', !!g.fav);
  $('#tabAchN').textContent = g.ach.total;
  $('#tabModN').textContent = g.mods.length;

  const srcText = g.plat === 'steam' ? 'STEAM · appdetails'
                : g.plat === 'epic'  ? 'EPIC · 本地清单'
                : '本地 · 手动添加';

  /* ── 概览 ── */
  $('#pane-overview').innerHTML = `
    <div class="body">
      <div>
        <div class="sec">
          <div class="sec-title">关于这款游戏<span class="mono2">${srcText}</span></div>
          ${g.desc.map(p => `<p class="desc">${p}</p>`).join('')}
        </div>

        <div class="sec">
          <div class="sec-title">截图<span class="mono2">3 / ${g.shots || 3}</span></div>
          <div class="shots">
            ${[1,2,3].map(i => `<div class="shot" style="--a:${g.a};--b:${g.b}"><span class="lbl">0${i}</span></div>`).join('')}
          </div>
        </div>

        <div class="sec">
          <div class="sec-title">最近解锁<span class="mono2">${g.recent.length} 个</span></div>
          <div class="recent">
            ${g.recent.length ? g.recent.map(r => `
              <div class="rc">
                <div class="ico" style="--a:${r.a};--b:${r.b}">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${ICONS[r.icon] || ICONS.star}</svg>
                </div>
                <div class="tx"><div class="n">${r.n}</div><div class="d">${r.d}</div></div>
              </div>`).join('')
            : `<div class="rc" style="flex:1 1 auto;color:var(--text-3);font-size:11.5px;line-height:1.75;padding:12px">
                 还没有解锁记录。启动一次游戏后，这里会按时间倒序列出最近的成就。</div>`}
          </div>
        </div>
      </div>

      <aside class="side">
        <div class="panel">
          <div class="row"><span class="k">来源</span><span class="v hi">${PLATNAME(g.plat)}</span></div>
          <div class="row"><span class="k">AppID</span><span class="v">${g.appid}</span></div>
          <div class="row col"><span class="k">安装位置</span><span class="v">${g.path}</span></div>
          <div class="row"><span class="k">累计时长</span><span class="v">${fmtH(g.hours)}</span></div>
          <div class="row"><span class="k">上次游玩</span><span class="v">${g.last}</span></div>
          <div class="row"><span class="k">添加于</span><span class="v">${g.added}</span></div>
        </div>

        <div class="achbar" data-goto="ach">
          <div class="ring" style="--p:${pct}"><i>${pct}%</i></div>
          <div>
            <div class="t1">成就进度</div>
            <div class="t2">${g.ach.unlocked} / ${g.ach.total} 已解锁</div>
          </div>
          <div class="go">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M6.2 3.4L10.8 8l-4.6 4.6"/></svg>
          </div>
        </div>
      </aside>
    </div>`;

  renderAchPane(g, pct);
  renderModPane(g);
  renderOptsPane(g);
}

/* ── 成就页签 ── */
function renderAchPane(g, pct) {
  const all = g.id === 'frostfall' ? ACH_FROSTFALL : [];
  const list = all.filter(a => {
    if (state.achFilter === 'on')   return a.on;
    if (state.achFilter === 'off')  return !a.on;
    if (state.achFilter === 'hide') return !!a.hidden;
    return true;
  });

  const chips = [
    { k:'all',  label:`全部 ${all.length}` },
    { k:'on',   label:`已解锁 ${all.filter(a => a.on).length}` },
    { k:'off',  label:`未解锁 ${all.filter(a => !a.on).length}` },
    { k:'hide', label:`隐藏 ${all.filter(a => a.hidden).length}` }
  ];

  $('#pane-ach').innerHTML = `
    <div class="ach-head">
      <div class="ring-lg" style="--p:${pct}"><i>${pct}%</i></div>
      <div>
        <div class="big">${g.ach.unlocked}<span> / ${g.ach.total}</span></div>
        <div class="sm">已解锁 · ${g.ach.hidden} 个隐藏成就</div>
      </div>
      <div class="src"><i></i>${g.ach.source}</div>
    </div>
    <div class="chips-bar">
      <div class="chip-line">
        ${chips.map(c => `<span class="chip${state.achFilter === c.k ? ' is-on' : ''}" data-achfilter="${c.k}">${c.label}</span>`).join('')}
      </div>
    </div>
    ${all.length ? `<div class="ach-grid">
      ${list.map(a => `
        <div class="ach${a.on ? '' : ' is-locked'}">
          <div class="ach-ico" style="--a:${a.a};--b:${a.b}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${ICONS[a.i]}</svg>
          </div>
          <div class="ach-body">
            <div class="ach-name">${a.n}</div>
            <div class="ach-desc">${a.d}</div>
          </div>
          <div class="ach-right">
            <div class="rar">${a.p === null ? '—' : a.p.toFixed(1) + '%'}<div class="bar"><i style="width:${a.p || 0}%"></i></div></div>
            <div class="when">${a.on ? a.at : '未解锁'}</div>
          </div>
        </div>`).join('')}
    </div>` : `
    <div class="empty-panel">
      <h4>已知道 ${g.ach.total} 个成就，定义还没缓存到本地</h4>
      <p>${g.plat === 'steam'
        ? '填入 Steam Web API Key 后，会一次性拉取官方成就列表并缓存，之后离线也能看。'
        : '本地游戏没有官方成就接口。可以指向它产生的本地成就文件，或者手动补录。'}</p>
      <div class="actions">
        <span class="chip is-on">${g.plat === 'steam' ? '拉取 Steam 成就定义' : '指向本地成就文件'}</span>
        <span class="chip">手动补录</span>
      </div>
    </div>`}`;
}

/* ── MOD 页签 ── */
function renderModPane(g) {
  $('#pane-mod').innerHTML = `
    <div class="mod-head">
      <span class="path">${g.path}\\mods</span>
      <div class="spacer"></div>
      <span class="chip">打开文件夹</span>
      <span class="chip is-on">重新扫描</span>
    </div>
    ${g.mods.length ? `
      <div class="mods">
        ${g.mods.map((m, i) => `
          <div class="mod ${m.on ? 'is-on' : 'is-off'}" data-mod="${i}" role="switch" tabindex="0" aria-checked="${m.on}">
            <button class="switch ${m.on ? 'is-on' : ''}" aria-label="启用 ${m.n}"></button>
            <div>
              <div class="mn">${m.n}</div>
              <div class="mv">${m.v}</div>
            </div>
            <span class="order">0${Math.min(i + 1, 9)}</span>
            <span class="sz">${m.sz}</span>
          </div>`).join('')}
      </div>`
    : `
      <div class="empty-panel">
        <h4>还没指定 MOD 目录</h4>
        <p>指定一个文件夹后，启动器会扫描其中的 MOD，按顺序加载。禁用只是改名，不会删除文件。</p>
        <div class="actions"><span class="chip is-on">选择文件夹</span></div>
      </div>`}`;
}

/* ── 启动选项页签 ── */
function renderOptsPane(g) {
  $('#pane-opts').innerHTML = `
    <div class="opts">
      <div>
        <div class="opt-row"><span class="ok">可执行文件</span><span class="field">${g.path}\\${g.exe}</span></div>
        <div class="opt-row"><span class="ok">工作目录</span><span class="field">${g.path}</span></div>
        <div class="opt-row"><span class="ok">启动参数</span><span class="field dim">— 未设置</span></div>
        <div class="opt-row"><span class="ok">以管理员运行</span>
          <span class="opt-hint">部分游戏需要写入受保护目录</span>
          <button class="switch" data-switch aria-label="以管理员身份运行"></button></div>
        <div class="opt-row"><span class="ok">退出后清理</span>
          <span class="opt-hint">只清理本游戏启动的子进程</span>
          <button class="switch is-on" data-switch aria-label="退出后清理残留进程"></button></div>
        <div class="opt-row"><span class="ok">存档位置</span><span class="field dim">%APPDATA%\\${g.id[0].toUpperCase() + g.id.slice(1)}\\SaveData</span></div>
      </div>

      <aside class="side">
        <div class="sec-title">启动配置档<span class="mono2">${g.mods.length ? 2 : 1} 套</span></div>
        <div class="profiles">
          <div class="prof is-on">默认<span class="pm">无参数</span></div>
          <div class="prof">纯净模式<span class="pm">禁用全部 MOD</span></div>
        </div>
        <div class="opt-hint" style="margin-top:12px">
          同一款游戏可以存多套参数，切换配置档不会改动游戏文件。
        </div>
      </aside>
    </div>`;
}

/* ═══════════ Toast ═══════════ */
function toast(kicker, title, meta) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `
    <div class="toast-ico">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7">${ICONS.star}</svg>
    </div>
    <div class="toast-body">
      <div class="toast-k">${kicker}</div>
      <div class="toast-t">${title}</div>
      <div class="toast-m">${meta}</div>
    </div>`;
  $('#toasts').appendChild(el);
  setTimeout(() => {
    el.classList.add('is-out');
    setTimeout(() => el.remove(), 240);
  }, 2600);
}

/* ═══════════ 视图切换 ═══════════ */
function goLibrary() {
  state.game = null;
  $('#v-detail').classList.remove('is-on');
  $('#v-library').classList.add('is-on');
  renderNav();
  renderRail();
  renderHero();
  renderWall();
}

function goGame(id) {
  const g = byId(id);
  if (!g) return goLibrary();
  state.game = id;
  state.tab = 'overview';
  state.achFilter = 'all';
  $('#v-library').classList.remove('is-on');
  $('#v-detail').classList.add('is-on');
  renderDetail();
  setTab('overview');
  renderNav();
  renderRail();
  $('#paneScroll').scrollTop = 0;
}

function setTab(t) {
  state.tab = t;
  document.querySelectorAll('#tabs .tab').forEach(el => el.classList.toggle('is-on', el.dataset.tab === t));
  document.querySelectorAll('.pane').forEach(el => el.classList.toggle('is-on', el.id === 'pane-' + t));
  $('#paneScroll').scrollTop = 0;
}

function launch(id) {
  const g = byId(id);
  if (!g) return;
  if (g.running) {
    toast('已切回', `《${g.cn}》`, '游戏窗口已置于最前');
    return;
  }
  g.running = true;
  g.sessionMin = 0;
  toast('正在启动', `《${g.cn}》`, g.exe);
  if (state.game === g.id) renderDetail();
  renderNav();
  renderRail();
  if (!state.game) { renderHero(); renderWall(); }
}

function stopGame(id) {
  const g = byId(id);
  if (!g) return;
  g.running = false;
  g.last = '刚刚';
  g.rec = 0;
  toast('已退出', `《${g.cn}》`, '本次游玩 0 分钟 · 已写入存档');
  if (state.game === g.id) renderDetail();
  renderNav();
  renderRail();
  renderHero();
  renderWall();
}

/* ═══════════ 事件 ═══════════ */
$('#nav').addEventListener('click', e => {
  const item = e.target.closest('[data-view]');
  if (!item) return;
  state.view = item.dataset.view;
  state.q = '';
  $('#q').value = '';
  if (state.game) { goLibrary(); return; }
  renderNav(); renderRail(); renderHero(); renderWall();
});

$('#nav').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const item = e.target.closest('[data-view]');
  if (!item) return;
  e.preventDefault();
  item.click();
});

$('#games').addEventListener('click', e => {
  const row = e.target.closest('[data-game]');
  if (row) goGame(row.dataset.game);
});
$('#games').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const row = e.target.closest('[data-game]');
  if (!row) return;
  e.preventDefault();
  goGame(row.dataset.game);
});

$('#wall').addEventListener('click', e => {
  const card = e.target.closest('[data-game]');
  if (card) goGame(card.dataset.game);
});
$('#wall').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest('[data-game]');
  if (!card) return;
  e.preventDefault();
  goGame(card.dataset.game);
});

$('#hero').addEventListener('click', e => {
  const play = e.target.closest('[data-hero-play]');
  if (play) { launch(GAMES.find(x => x.running)?.id || GAMES[0].id); return; }
  const go = e.target.closest('[data-hero-game]');
  if (go) goGame(go.dataset.heroGame);
});

$('#back').addEventListener('click', goLibrary);
$('#back').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goLibrary(); }
});

$('#tabs').addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) setTab(tab.dataset.tab);
});

$('#btnPlay').addEventListener('click', () => launch(state.game));
$('#btnStill').addEventListener('click', () => stopGame(state.game));
$('#btnAch').addEventListener('click', () => setTab('ach'));
$('#btnFav').addEventListener('click', () => {
  const g = byId(state.game);
  if (!g) return;
  g.fav = !g.fav;
  renderDetail();
  renderNav();
  renderRail();
  toast(g.fav ? '已加入收藏' : '已移出收藏', `《${g.cn}》`, g.fav ? '在侧栏「收藏」中可以找到' : '');
});

/* 概览里的成就卡 → 成就页签 */
$('#paneScroll').addEventListener('click', e => {
  const go = e.target.closest('[data-goto]');
  if (go) { setTab(go.dataset.goto); return; }

  const chip = e.target.closest('[data-achfilter]');
  if (chip) {
    state.achFilter = chip.dataset.achfilter;
    const g = byId(state.game);
    renderAchPane(g, achPct(g));
    return;
  }

  const mod = e.target.closest('[data-mod]');
  if (mod) {
    const g = byId(state.game);
    const m = g.mods[+mod.dataset.mod];
    m.on = !m.on;
    renderModPane(g);
    toast(m.on ? 'MOD 已启用' : 'MOD 已禁用', m.n, m.on ? '下次启动时加载' : '已移入 _disabled');
    return;
  }

  const sw = e.target.closest('[data-switch]');
  if (sw) sw.classList.toggle('is-on');
});

$('#platChips').addEventListener('click', e => {
  const chip = e.target.closest('[data-plat]');
  if (!chip) return;
  state.plat = chip.dataset.plat;
  document.querySelectorAll('#platChips .chip').forEach(c => c.classList.toggle('is-on', c === chip));
  renderWall();
});

$('#sortBtn').addEventListener('click', () => {
  const order = ['recent', 'hours', 'name'];
  const label = { recent:'最近游玩 ↓', hours:'时长 ↓', name:'名称 A–Z' };
  state.sort = order[(order.indexOf(state.sort) + 1) % order.length];
  $('#sortBtn').textContent = label[state.sort];
  renderRail();
  renderWall();
});

$('#q').addEventListener('input', e => {
  state.q = e.target.value.trim();
  renderRail();
  renderWall();
});

$('#libClear').addEventListener('click', () => {
  state.q = '';
  $('#q').value = '';
  renderRail();
  renderWall();
  $('#q').focus();
});

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (state.game) goLibrary();
    $('#q').focus();
  }
  if (e.key === 'Escape' && state.q) {
    state.q = '';
    $('#q').value = '';
    renderRail();
    renderWall();
  }
});

/* ═══════════ 启动 ═══════════ */
(function boot() {
  const m = location.hash.match(/^#\/game\/([\w-]+)/);
  m ? goGame(m[1]) : goLibrary();
})();

window.addEventListener('hashchange', () => {
  const m = location.hash.match(/^#\/game\/([\w-]+)/);
  m ? goGame(m[1]) : goLibrary();
});
</script>
</body>
</html>
